{% extends 'base.html' %}

{% block title %}Delete Service{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mt-2">
            <div class="card-body text-center py-4">
                <h5 class="page-title">Delete Service</h5>
                <p class="mb-1">Are you sure you want to delete <strong>{{ service.service_name }}</strong>?</p>
                <p class="text-muted small">This action cannot be undone.</p>

                <form method="post" class="d-flex justify-content-center gap-2 mt-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    <a href="{% url 'service_detail' service.pk %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
